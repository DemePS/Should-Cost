[project]
name = "should-cost"
version = "0.1.0"
description = "Hager Should-Cost Builder backend: FastAPI API + deterministic workflow engine on top of the hager-should-cost-builder skill."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "azure-identity>=1.19,<2.0",
  "azure-data-tables>=12.5,<13.0",
  "azure-storage-blob>=12.23,<13.0",
  "openpyxl>=3.1,<4.0",
  "pdfplumber>=0.11,<1.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "pandas>=2.2,<3.0",
  "pyxlsb>=1.0,<2.0",
  # Selective install (lighter than the `agent-framework` meta-package): core
  # chat-client/agent abstractions + the Microsoft Foundry integration only.
  "agent-framework-core>=1.16,<2.0",
  "agent-framework-foundry>=1.16,<2.0",
  "tenacity>=9.0,<10.0",
  "structlog>=24.4,<25.0",
  "opencensus-ext-azure>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-httpx>=0.33,<1.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "types-openpyxl",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["should_cost*"]
