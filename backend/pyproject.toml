[project]
name = "should-cost"
version = "0.1.0"
description = "Hager Should-Cost Builder backend: FastAPI API + deterministic workflow engine on top of the hager-should-cost-builder skill."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "azure-identity>=1.19,<2.0",
  "azure-data-tables>=12.5,<13.0",
  "azure-storage-blob>=12.23,<13.0",
  "openpyxl>=3.1,<4.0",
  "pdfplumber>=0.11,<1.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "pandas>=2.2,<3.0",
  "pyxlsb>=1.0,<2.0",
  # Selective install (lighter than the `agent-framework` meta-package): core
  # chat-client/agent abstractions + one integration per supported MODEL_PROVIDER.
  # DeepSeek has no dedicated connector — its API is OpenAI-compatible, so it's reached
  # through agent-framework-openai's OpenAIChatClient with a DeepSeek base_url (see
  # should_cost/tools/model_client.py).
  "agent-framework-core>=1.16,<2.0",
  "agent-framework-foundry>=1.16,<2.0",
  "agent-framework-anthropic",
  "agent-framework-openai>=1.16,<2.0",
  # Orchestration layer: one LangGraph node per should-cost step (0-7), replacing the
  # hand-rolled async engine.py. Nodes call the existing model_client.py/research_agent.py
  # Agent Framework chat clients directly — LangGraph doesn't require LangChain model
  # objects inside a node, only a state schema, so the already-debugged Foundry/
  # Anthropic/DeepSeek integration is untouched by this.
  "langgraph>=1.2,<2.0",
  # Durable checkpointer backend for the graph's own resume mechanics (interrupt/Command)
  # — a real, maintained implementation rather than a bespoke BaseCheckpointSaver (its
  # interface covers channel versioning, pending writes, pruning, etc.; getting that
  # wrong risks silent state corruption, not just a crash). A local SQLite file survives
  # restarts on a single App Service instance; see docs/design.md for why a bespoke
  # Azure Table/Blob-backed one is a documented follow-up, not done here. This is
  # separate from JobStateStore, which still persists a human/API-readable Job snapshot
  # on every node (unchanged) — the sqlite file only backs LangGraph's own resumability.
  # Pinned >=3.1.3: 2.0.10 (an older resolution of this same range) has a real bug
  # against the aiosqlite version pulled in here (self.conn.is_alive() doesn't exist on
  # its Connection) — confirmed live, not a guess.
  "langgraph-checkpoint-sqlite>=3.1.3,<4.0",
  "tenacity>=9.0,<10.0",
  "structlog>=24.4,<25.0",
  "opencensus-ext-azure>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-httpx>=0.33,<1.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "types-openpyxl",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-as-a-default-argument is the idiomatic DI pattern, not
# the "mutable default" footgun this rule is meant to catch.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Ported verbatim from the skill's own scripts/build_should_cost_model.py — see its
# module docstring for why these are not "fixed" (including a latent bug already present
# in the source script, _setup_calc_sheets, which is unreachable in practice because the
# reference template this app ships is always present).
"should_cost/excel/legacy_builder.py" = ["E401", "F401", "F821", "F841", "E702", "E501", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["should_cost*"]
